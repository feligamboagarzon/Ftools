[build]
  command = "npm run build"
  publish = "dist"

# SPA fallback so react-router routes resolve on refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cross-origin isolation for ffmpeg.wasm multi-threading.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
